<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Visualizer</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      height: 100%;
      width: 100%;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Add additional styles as needed */
  </style>
</head>

<body>
  <div id="app">
    <!-- Application UI will be injected here -->
    <button id="startButton"
      style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 1rem 2rem; font-size: 1.2rem;">Start</button>
    <!-- Add within the <div id="app"> -->
    <div id="configModal"
      style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center;">
      <div style="background-color: #fff; padding: 2rem; border-radius: 8px; width: 400px;">
        <h2>Settings</h2>
        <form id="settingsForm">
          <div>
            <label>
              <input type="checkbox" id="midiEnabled" /> Enable MIDI
            </label>
          </div>
          <div>
            <label for="audioInput">Audio Input:</label>
            <select id="audioInput">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div>
            <label for="midiInput">MIDI Input:</label>
            <select id="midiInput">
              <option value="all">All MIDI Devices</option>
              <!-- Dynamically populated -->
            </select>
          </div>
          <div>
            <label>MIDI Channels:</label>
            <div id="midiChannels">
              <!-- Checkboxes for channels 1-16 -->
              ${Array.from({ length: 16 }, (_, i) => `
              <label>
                <input type="checkbox" value="${i + 1}" checked /> ${i + 1}
              </label>
              `).join('')}
            </div>
          </div>
          <button type="submit">Save</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>

</html>
